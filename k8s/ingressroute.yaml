---
# Catalyst UI — HTTPS + Authentik forward-auth SSO on catalyst.talos00
# (TALOS-xgrl.14). Gated by the `authentik` forward-auth middleware; SSO via the
# forward_single provider in talos-homelab sister-apps-blueprint.yaml. TLS: the
# default TLSStore serves the *.talos00 wildcard via SNI. web→https redirect below.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: catalyst-ui
  namespace: catalyst
  labels:
    app: catalyst-ui
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Catalyst UI"
    gethomepage.dev/description: "Component library & design system"
    gethomepage.dev/group: "Apps"
    gethomepage.dev/icon: "storybook.png"
    gethomepage.dev/href: "https://catalyst.talos00"
    gethomepage.dev/siteMonitor: "http://catalyst-ui.catalyst.svc.cluster.local:80"
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`catalyst.talos00`)
      kind: Rule
      middlewares:
        - name: authentik
          namespace: authentik
        # Puts Catalyst UI on the cross-app nav bar. The bar's link list is
        # DERIVED, not configured: the discovery sidecar in talos-homelab
        # (infrastructure/base/themepark/server/nav/build_nav.py) lists only
        # routes that carry a catalyst-* injection middleware, so the
        # gethomepage.dev annotations above were never enough on their own --
        # this reference is what makes the app appear, under the "Apps" group
        # its annotation already names.
        #
        # catalyst-nav, NOT catalyst-<slug>: the per-app injectors exist only
        # for apps theme.park ships a base stylesheet for, which maps that
        # app's DOM onto the theme's variables. There is no such sheet for this
        # app and there should not be -- it IS the design system the theme is
        # derived from, so restyling it would be circular.
        #
        # Ordering matters: authentik first. These are applied forward on the
        # request, so auth runs before the body rewriter ever sees a response.
        - name: catalyst-nav
          namespace: traefik
      services:
        - name: catalyst-ui
          port: 80
  tls: {}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: catalyst-ui-http
  namespace: catalyst
  labels:
    app: catalyst-ui
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`catalyst.talos00`)
      kind: Rule
      middlewares:
        - name: redirect-https
          namespace: traefik
      services:
        - name: catalyst-ui
          port: 80
